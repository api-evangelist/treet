name: Treet
description: >-
  Treet is a branded recommerce (resale) platform that lets e-commerce brands run
  their own secondhand marketplaces. Founded in 2021 by marketplace veterans Jake
  Disraeli and Sonia Yang (formerly of Indiegogo and Airbnb), Treet powers resale
  for 250+ global brands through four stackable programs: Peer-to-Peer (customers
  buy and sell from each other for cash or brand credit), Trade-In, Off-Price
  liquidation of excess inventory, and Returns rerouting. Treet integrates into a
  brand's existing commerce stack — Shopify, Adobe Commerce, BigCommerce,
  WooCommerce and Salesforce Commerce, plus logistics (ShipHero, ShipBob),
  marketing/loyalty (Klaviyo, Yotpo, LoyaltyLion) and returns (Loop, Happy
  Returns) partners via its "Infinite Integrations" platform. Treet is an API
  consumer rather than an API producer: it publishes no public developer API, API
  documentation, developer portal, SDKs or webhooks of its own, and delivers to
  brands as a managed SaaS and Shopify app. Backed by Two Sigma Ventures and
  Techstars.
